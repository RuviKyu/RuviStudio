name: writing-room self-test
on:
  push:
    paths: ["writing-room/**"]
  pull_request:
    paths: ["writing-room/**"]
  workflow_dispatch:
jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python writing-room/tools/selftest_chain.py --work /tmp/ruvi_selftest

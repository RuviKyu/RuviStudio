<!doctype html>
<html><head><meta charset="utf-8"><title>RUVI Conductor renderer</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden;width:1920px;height:1080px}

  #bg{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover}

  #world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:flat;will-change:transform}
  #map{position:absolute;transform-origin:0 0;image-rendering:auto;backface-visibility:hidden}
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
  .pin{position:absolute;width:0;height:0;transform-origin:0 0;will-change:transform}
  .pin svg{position:absolute;overflow:visible}
  .label{position:absolute;white-space:nowrap;color:#fff;font-family:"Algerian","Cinzel","Georgia",serif;text-align:center;transform:translate(-50%,-50%);transform-origin:50% 50%;will-change:transform;
         paint-order:stroke fill;-webkit-text-stroke:0 #000}
  .hl-g,.hl-r{will-change:transform}
  #edge{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
        -webkit-mask-image:radial-gradient(ellipse 78% 76% at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,1) 100%);mask-image:radial-gradient(ellipse 78% 76% at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,1) 100%)}
  /* stills */
  #still{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:2200px;perspective-origin:50% 50%}
  .st-layer{position:absolute;transform-origin:50% 50%;transform-style:flat}
  .card{position:relative;width:2752px;height:1534px;overflow:hidden;background:#0a0a0a}
  .card .cbg{position:absolute;left:0;top:0;width:2752px;height:1534px}
  .card .portrait{position:absolute;transform-origin:50% 50%}
  .card .mat{position:absolute;background:#eee3c9;box-shadow:12px 14px 40px rgba(0,0,0,.6)}
  .card .name{position:absolute;color:#fff;font-family:"Pirata One","Germania One","Old English Text MT","Algerian",serif;text-align:center;white-space:pre;line-height:1.05}
</style></head>
